<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Ajayeb</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Keep these two colours in sync with --table in src/lib/styles/tokens.css
         and THEME_COLORS in src/lib/ui/theme.svelte.ts. -->
    <meta name="theme-color" content="#faf1df" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1936" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A two-player card drafting game with original art, playable in the browser."
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- The app icon as PNG for iOS and the web app manifest, made from the
         approved icon/app original by tools/art/process.mjs --app-icons.
         The manifest's colours are the light --table (see theme-color). -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- Font preloads live in +layout.svelte, where Vite supplies their
         content-hashed URLs. -->
    <script>
      // Theme and Home bootstrap. It runs before the first paint, so the
      // page never flashes the wrong theme. src/lib/ui/theme.svelte.ts owns
      // the theme after the app starts and uses the same storage key and
      // attributes.
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('ajayeb:theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (e) {
          // Storage can be blocked (private mode, sandboxed frames).
        }
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-pref', pref);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = theme;
        if (pref !== 'system') {
          var color = dark ? '#0a1936' : '#faf1df';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
        }

        // Home's device state, read before the first paint so the
        // build-time Home does not move when it hydrates (M11.home-cold-cls):
        // - data-boot-offer: the first-launch tutorial offer will show (no
        //   saved rooms, offer not declined, tutorial not done; the same
        //   test as offersTutorial in src/lib/ui/tips.svelte.ts, kept in
        //   step by src/app-bootstrap.test.ts), so Home shows its build-time
        //   offer at once.
        // - data-locale-pending: a stored locale other than English, whose
        //   messages load after the app starts. Home keeps its text hidden
        //   (not its hero) until the root layout has switched to it, and
        //   shows it anyway after a few seconds if that never happens.
        // Blocked storage or bad JSON reads as a new English device, like
        // the stores themselves.
        function read(key) {
          try {
            return JSON.parse(localStorage.getItem(key) || 'null');
          } catch (e) {
            return null;
          }
        }
        var tips = read('ajayeb:tips');
        var tutorial = tips && typeof tips === 'object' ? tips.tutorial : null;
        var rooms = read('ajayeb:rooms');
        var offer =
          !(tutorial && (tutorial.offer === 'declined' || tutorial.done === true)) &&
          !(Array.isArray(rooms) && rooms.length > 0);
        if (offer) root.setAttribute('data-boot-offer', '');
        var settings = read('ajayeb:settings');
        // Keep in sync with LOCALES in src/lib/i18n/locale.svelte.ts.
        if (settings && settings.locale === 'fa') {
          root.setAttribute('data-locale-pending', settings.locale);
          setTimeout(function () {
            root.removeAttribute('data-locale-pending');
          }, 6000);
        }
      })();
    </script>
    <!-- Language stays English until the requested locale's messages have
         loaded. The root layout changes text, digits and direction together. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
